<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- The page only talks to the device that serves the game: nothing leaves it, not even the usage
         statistics MediaPipe sends to Google every minute (the browser refuses them). -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:" />
    <title>Mini Future Me</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Added to the home screen of a tablet, the game opens full screen, without the browser's bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mini Future Me" />
    <meta name="theme-color" content="#e1f4f0" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
